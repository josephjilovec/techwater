<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">TechWater sample Water Use Review</title><desc id="desc">Illustrative data. Period A: 24,000 US gallons over 30 days, 800 per day. Period B: 31,500 over 35 days, 900 per day. Daily use increased 12.5 percent; billed total increased 31.3 percent. These figures do not establish a cause.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d9eeea"/><stop offset="1" stop-color="#b8d8d4"/></linearGradient><filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#083e49" flood-opacity=".12"/></filter></defs>
<rect width="1000" height="1100" rx="18" fill="url(#bg)"/>
<g filter="url(#shadow)"><rect x="75" y="66" width="850" height="962" rx="8" fill="#fffefa"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#083e49">
<text x="130" y="139" font-size="28" font-weight="700">Tech<tspan fill="#086b76">Water</tspan></text>
<rect x="637" y="107" width="232" height="40" rx="20" fill="#e5f2ef"/><text x="753" y="133" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1">ILLUSTRATIVE DATA</text>
<path d="M130 173H870" stroke="#d2e4df"/>
<text x="130" y="226" font-size="14" letter-spacing="2" fill="#086b76">SAMPLE REPORT / 01</text>
<text x="130" y="289" font-size="49" font-weight="600" letter-spacing="-2">Water Use Review</text>
<text x="130" y="326" font-size="19" fill="#4b686d">One property. Two billing periods. A clearer baseline.</text>
<rect x="130" y="369" width="740" height="137" rx="5" fill="#edf5f2"/>
<text x="157" y="402" font-size="14" fill="#4b686d">DAILY USE CHANGE</text><text x="155" y="472" font-size="65" font-weight="600" letter-spacing="-3">+12.5%</text>
<path d="M470 392V482" stroke="#c3d9d3"/>
<text x="500" y="420" font-size="19">Billed total increased 31.3%.</text>
<text x="500" y="453" font-size="18" fill="#4b686d">Period B covered five more days.</text>
<text x="130" y="556" font-size="17" font-weight="700">Average daily consumption</text><text x="870" y="556" text-anchor="end" font-size="14" fill="#4b686d">US gallons / day</text>
<text x="130" y="608" font-size="16">A</text><rect x="170" y="585" width="560" height="34" rx="3" fill="#9cbfbb"/><text x="750" y="609" font-size="20" font-weight="700">800</text>
<text x="130" y="665" font-size="16">B</text><rect x="170" y="642" width="630" height="34" rx="3" fill="#086b76"/><text x="819" y="666" font-size="20" font-weight="700">900</text>
<path d="M130 713H870" stroke="#d2e4df"/>
<g font-size="16" fill="#4b686d"><text x="130" y="747">Billing period</text><text x="535" y="747">Days</text><text x="870" y="747" text-anchor="end">Billed US gallons</text></g>
<g font-size="19"><text x="130" y="788">Period A</text><text x="535" y="788">30</text><text x="870" y="788" text-anchor="end">24,000</text><text x="130" y="830">Period B</text><text x="535" y="830">35</text><text x="870" y="830" text-anchor="end">31,500</text></g>
<path d="M130 855H870" stroke="#d2e4df"/>
<circle cx="141" cy="895" r="5" fill="#086b76"/><text x="161" y="901" font-size="17" font-weight="700">Next: review occupancy, irrigation and site records.</text>
<text x="130" y="951" font-size="15" fill="#4b686d">Fictional figures for illustration. A change is a question to investigate,</text><text x="130" y="975" font-size="15" fill="#4b686d">not a leak diagnosis, savings claim or completed client result.</text>
</g></svg>